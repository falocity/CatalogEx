{{- $releaseName := .Release.Name -}}
{{- $chartName := include "catalogex.name" . -}}
{{- $tracingUrl := include "catalogex.tracingUrl" . -}}
{{- $metricsUrl := include "catalogex.metricsUrl" . -}}
{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $releaseName }}-{{ $chartName }}-configmap
data:
  REQUEST_PAYLOAD_LIMIT: {{ .Values.env.requestPayloadLimit | quote }}
  RESPONSE_COMPRESSION_ENABLED: {{ .Values.env.responseCompressionEnabled | quote }}
  LOG_PRETTY_PRINT_ENABLED: 'false'
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  POSTGRES_HOST: {{ .Values.dbConfig.host | quote }}
  POSTGRES_PORT: {{ .Values.dbConfig.port | quote }}
  POSTGRES_DB: {{ .Values.dbConfig.database | quote }}
  DB_CERT_PATH: /tmp/certs/{{ .Values.dbConfig.sslAuth.certFileName }}
  DB_KEY_PATH: /tmp/certs/{{ .Values.dbConfig.sslAuth.keyFileName }}
  DB_CA_PATH: /tmp/certs/{{ .Values.dbConfig.sslAuth.caFileName }}
  {{- if .Values.dbConfig.sslAuth.enabled }}
  DB_ENABLE_SSL_AUTH: "true"
  {{- else }}
  DB_ENABLE_SSL_AUTH: "false"
  {{- end }}
  {{- if .Values.global.tracing.enabled }}
  TELEMETRY_TRACING_ENABLED: 'true'
  TELEMETRY_TRACING_URL: {{ $tracingUrl | quote }}
  TELEMETRY_TRACING_RATIO: {{ .Values.env.tracing.ratio | quote }}
  {{- end }}
  {{- if .Values.global.metrics.enabled }}
  TELEMETRY_METRICS_ENABLED: 'true'
  TELEMETRY_METRICS_URL: {{ $metricsUrl | quote }}
  {{- end }}
{{- end }}