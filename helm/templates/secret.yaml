{{- $releaseName := .Release.Name -}}
{{- $chartName := include "catalogex.name" . -}}
{{- if .Values.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $releaseName }}-{{ $chartName }}-secret
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: {{ $chartName }}
    component: {{ $chartName }}
    environment: {{ include "catalogex.environment" . }}
    release: {{ $releaseName }}
    {{- include "catalogex.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.dbConfig.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.dbConfig.password | b64enc | quote }}
{{- end }}
